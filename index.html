<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全員で遊べる！回し読みババ抜き</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div id="game-container">
        <h1>回し読みババ抜き 🃏</h1>
        <p class="desc">サーバー不要！コードやQRコードを友達に送って順番を回すババ抜きです。</p>

        <div id="setup-panel" class="panel">
            <h2>1. ゲームに参加・開始</h2>
            <div class="setup-section">
                <h3>新しくゲームを始める場合</h3>
                <input type="number" id="player-count" value="3" min="2" max="10"> 人で
                <button id="btn-start">ゲームを開始する</button>
            </div>
            <hr>
            <div class="setup-section">
                <h3>前の人からデータを受け取った場合</h3>
                <textarea id="input-code" placeholder="ここに引き継ぎコードを貼り付けてください"></textarea><br>
                <button id="btn-load">データを読み込んで再開</button>
            </div>
        </div>

        <div id="game-panel" class="panel hidden">
            <h2 id="turn-title">あなたのターン</h2>
            
            <div id="action-section">
                <p>どのプレイヤーからカードを引きますか？</p>
                <div id="target-buttons"></div>
                <div id="opponent-hand" class="hand hidden"></div>
            </div>

            <hr>
            <h3>あなたの現在の名番: プレイヤー <span id="my-index">X</span></h3>
            <div id="my-hand" class="hand"></div>
            
            <div id="system-message"></div>
        </div>

        <div id="pass-panel" class="panel hidden">
            <h2 style="color: #ffeb3b;">➔ 次のプレイヤーへ交代</h2>
            <p>あなたの操作は終わりました！<br>下のコードをコピーして<strong>次のプレイヤー</strong>に送るか、QRコードをスマホで読み取ってもらってください。</p>
            
            <button id="btn-copy">コードをコピーする</button><br>
            <textarea id="output-code" readonly onclick="this.select()"></textarea>
            
            <div id="qrcode-container">
                <div id="qrcode"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
